# Render Blueprint — Mood Code(가구) 와 동일 Docker 방식
services:
  - type: web
    name: scmaglev
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./book/Dockerfile
    dockerContext: ./book
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SCMAGLEV_MAX_TRACKED_TRAINS
        value: "200"
      - key: TOSS_PAYMENTS_MOCK_ONLY
        value: "1"
      - key: OPENAI_ENABLED
        value: auto
      - key: CONGESTION_LAZY_LOAD
        value: "1"
      - key: CONGESTION_WARMUP
        value: "0"
      - key: CONGESTION_AUTO_RETRAIN
        value: "1"
      - key: CONGESTION_RETRAIN_HOURS
        value: "24"
      - key: CONGESTION_MIN_NEW_SAMPLES
        value: "300"
      - key: CONGESTION_OBSERVATION_INTERVAL_SEC
        value: "30"
