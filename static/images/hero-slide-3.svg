<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="400" fill="url(#bg3)"/>
  <ellipse cx="720" cy="420" rx="600" ry="120" fill="#0f172a" fill-opacity="0.4"/>
  <!-- seat map panel -->
  <rect x="780" y="70" width="520" height="260" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <rect x="810" y="100" width="460" height="36" rx="8" fill="#1e3a8a" fill-opacity="0.5"/>
  <rect x="830" y="112" width="80" height="12" rx="4" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="920" y="112" width="60" height="12" rx="4" fill="#ffffff" fill-opacity="0.3"/>
  <!-- seat grid 4 cols -->
  <g transform="translate(830 160)">
    <rect x="0" y="0" width="48" height="40" rx="6" fill="#1d4ed8"/>
    <rect x="60" y="0" width="48" height="40" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b"/>
    <rect x="150" y="0" width="48" height="40" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b"/>
    <rect x="210" y="0" width="48" height="40" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b"/>
    <rect x="0" y="55" width="48" height="40" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b"/>
    <rect x="60" y="55" width="48" height="40" rx="6" fill="#cbd5e1" fill-opacity="0.3"/>
    <rect x="150" y="55" width="48" height="40" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b"/>
    <rect x="210" y="55" width="48" height="40" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b"/>
    <rect x="0" y="110" width="48" height="40" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b"/>
    <rect x="60" y="110" width="48" height="40" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#64748b"/>
    <rect x="150" y="110" width="48" height="40" rx="6" fill="#cbd5e1" fill-opacity="0.3"/>
    <rect x="210" y="110" width="48" height="40" rx="6" fill="#1d4ed8"/>
  </g>
  <!-- ticket card -->
  <rect x="120" y="100" width="280" height="160" rx="14" fill="#ffffff"/>
  <rect x="120" y="100" width="280" height="50" rx="14" fill="#1e3a8a"/>
  <rect x="120" y="136" width="280" height="14" fill="#1e3a8a"/>
  <rect x="145" y="115" width="100" height="10" rx="3" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="145" y="175" width="60" height="8" rx="2" fill="#64748b"/>
  <rect x="145" y="195" width="180" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="145" y="215" width="140" height="8" rx="2" fill="#cbd5e1"/>
  <rect x="145" y="235" width="100" height="8" rx="2" fill="#0891b2" fill-opacity="0.5"/>
  <!-- QR placeholder -->
  <rect x="310" y="170" width="60" height="60" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <g fill="#1e3a8a">
    <rect x="318" y="178" width="8" height="8"/><rect x="334" y="178" width="8" height="8"/>
    <rect x="318" y="194" width="8" height="8"/><rect x="350" y="194" width="8" height="8"/>
    <rect x="334" y="210" width="8" height="8"/><rect x="350" y="178" width="8" height="8"/>
  </g>
  <!-- payment check -->
  <circle cx="480" cy="280" r="36" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="2"/>
  <path d="M465 280 L475 292 L498 268" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
