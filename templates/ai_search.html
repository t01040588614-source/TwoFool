<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCMagLEV AI 검색</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/site-favicon.svg">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: #eef2ff;
      color: #0f172a;
    }
    .wrap {
      max-width: 920px;
      margin: 24px auto;
      padding: 0 16px 32px;
    }
    .top-link {
      margin-bottom: 12px;
    }
    .top-link a {
      color: #1e3a8a;
      text-decoration: none;
      font-weight: 600;
    }
    .panel {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
      background: #fff;
      border: 1px solid #dbeafe;
    }
    .head {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .head h1 {
      margin: 0;
      font-size: 22px;
    }
    .head p {
      margin: 6px 0 0;
      opacity: 0.92;
      font-size: 14px;
    }
    .head-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill, .ghost {
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.12);
      color: #fff;
      cursor: pointer;
    }
    .route-bar {
      padding: 12px 16px;
      background: #eff6ff;
      border-bottom: 1px solid #dbeafe;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 14px;
    }
    .route-chip {
      background: #fff;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 6px 12px;
      font-weight: 700;
      color: #1d4ed8;
    }
    .suggest {
      padding: 14px 16px 6px;
    }
    .suggest h2 {
      margin: 0 0 10px;
      font-size: 13px;
      color: #64748b;
    }
    .suggest-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .suggest button {
      border: 1px solid #dbeafe;
      background: #f8fafc;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chat {
      min-height: 320px;
      max-height: 52vh;
      overflow: auto;
      padding: 16px;
      background: linear-gradient(180deg, #f8fafc, #ffffff);
    }
    .msg {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: flex-start;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #dbeafe;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex: 0 0 auto;
    }
    .bubble {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 14px;
      max-width: 78%;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 14px;
    }
    .msg.user {
      flex-direction: row-reverse;
    }
    .msg.user .bubble {
      background: #eff6ff;
      border-color: #bfdbfe;
    }
    .composer {
      border-top: 1px solid #e2e8f0;
      padding: 14px 16px 10px;
      background: #fff;
    }
    .composer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }
    .composer input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
    }
    .composer button {
      border: 0;
      background: #2563eb;
      color: #fff;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .composer small {
      display: block;
      margin-top: 8px;
      color: #64748b;
      font-size: 12px;
    }
    .route-edit {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .route-edit input {
      width: 88px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-link"><a href="/">← 승차권 예매로 돌아가기</a></div>
    <div class="panel">
      <div class="head">
        <div>
          <h1>SCMagLEV AI 검색</h1>
          <p>열차·예매·운행 정보를 편하게 물어보세요</p>
        </div>
        <div class="head-actions">
          <span id="mode-pill" class="pill">규칙 기반</span>
          <button id="clear-chat" type="button" class="ghost">대화 지우기</button>
        </div>
      </div>
      <div class="route-bar">
        <span class="route-chip" id="route-label">서울 → 수원</span>
        <span>현재 예매 조건과 연동되어 답변합니다</span>
        <div class="route-edit">
          <input id="departure" value="서울" aria-label="출발">
          <input id="arrival" value="수원" aria-label="도착">
          <button id="apply-route" type="button" class="pill" style="color:#1e3a8a;background:#fff;border-color:#bfdbfe;">적용</button>
        </div>
      </div>
      <div class="suggest">
        <h2>추천 질문</h2>
        <div class="suggest-row">
          <button type="button" data-q="서울→부산 추천">🚄 서울→부산 추천</button>
          <button type="button" data-q="가장 빠른 열차">⚡ 가장 빠른 열차</button>
          <button type="button" data-q="지연 현황">⏱️ 지연 현황</button>
          <button type="button" data-q="예매 방법">💳 예매 방법</button>
        </div>
      </div>
      <div id="chat" class="chat" aria-live="polite"></div>
      <div class="composer">
        <div class="composer-row">
          <input id="message" placeholder="무엇이든 물어보세요... (예: 부산 가는 가장 저렴한 열차)">
          <button id="send" type="button">전송</button>
        </div>
        <small>OpenAI Key 연결 시 GPT/학습모델 답변 · 없으면 규칙 기반 안내</small>
      </div>
    </div>
  </div>
  <script>
    const chat = document.getElementById("chat");
    const modePill = document.getElementById("mode-pill");
    const routeLabel = document.getElementById("route-label");
    const departureInput = document.getElementById("departure");
    const arrivalInput = document.getElementById("arrival");
    const messageInput = document.getElementById("message");

    const INTRO = "안녕하세요! SCMagLEV AI 여행 AI 도우미입니다.\n"
      + "열차 검색, 예매 방법, 지연·환불 안내를 도와드릴게요.\n"
      + "• 「서울→부산」처럼 구간을 적어 주세요.\n"
      + "• 추천 질문 버튼으로 바로 시작할 수 있습니다.\n"
      + "• OpenAI Key 연결 시 GPT/학습모델로 더 자연스럽게 답변합니다.";

    function readRouteFromQuery() {
      const params = new URLSearchParams(window.location.search);
      const dep = params.get("departure");
      const arr = params.get("arrival");
      if (dep) departureInput.value = dep;
      if (arr) arrivalInput.value = arr;
      updateRouteLabel();
    }

    function updateRouteLabel() {
      routeLabel.textContent = `${departureInput.value.trim() || "서울"} → ${arrivalInput.value.trim() || "수원"}`;
    }

    function appendMessage(text, role) {
      const row = document.createElement("div");
      row.className = `msg ${role}`;
      row.innerHTML = role === "assistant"
        ? `<div class="avatar">🤖</div><div class="bubble">${escapeHtml(text)}</div>`
        : `<div class="avatar">🙂</div><div class="bubble">${escapeHtml(text)}</div>`;
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    async function loadStatus() {
      try {
        const res = await fetch("/api/scmaglev/passenger/ai-chat/status");
        const data = await res.json();
        modePill.textContent = data.mode_label || "규칙 기반";
      } catch (_) {
        modePill.textContent = "규칙 기반";
      }
    }

    async function sendMessage(text) {
      const message = (text || messageInput.value || "").trim();
      if (!message) return;
      messageInput.value = "";
      appendMessage(message, "user");
      appendMessage("답변 생성 중...", "assistant");
      const pending = chat.lastElementChild;
      try {
        const res = await fetch("/api/scmaglev/passenger/ai-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            departure: departureInput.value.trim(),
            arrival: arrivalInput.value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "요청 실패");
        pending.querySelector(".bubble").textContent = data.reply || "답변을 생성하지 못했습니다.";
        if (data.mode_label) modePill.textContent = data.mode_label;
      } catch (error) {
        pending.querySelector(".bubble").textContent = `오류: ${error.message}`;
      }
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("send").onclick = () => sendMessage();
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
    document.getElementById("clear-chat").onclick = () => {
      chat.innerHTML = "";
      appendMessage(INTRO, "assistant");
    };
    document.getElementById("apply-route").onclick = updateRouteLabel;
    for (const button of document.querySelectorAll("[data-q]")) {
      button.onclick = () => sendMessage(button.dataset.q || "");
    }

    readRouteFromQuery();
    appendMessage(INTRO, "assistant");
    loadStatus();
  </script>
</body>
</html>
