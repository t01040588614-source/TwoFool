<!doctype html>
<html lang="ko" data-theme="passenger">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCMAGLEV 승차권예매</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/site-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://js.tosspayments.com/v1/payment"></script>
  <style>
    .quick-book-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 16px;
      padding: 20px;
      border: 0;
      border-radius: 12px;
      background: #f8fafc;
    }
    .quick-book-fields {
      display: grid;
      grid-template-columns: 1fr auto 1fr 150px;
      gap: 12px;
      align-items: end;
    }
    .quick-book-fields input, .quick-book-fields select {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      padding: 12px 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .quick-book-fields input:focus, .quick-book-fields select:focus {
      outline: none;
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }
    .search-advanced.collapsed { display: none; }
    .booking-timeline {
      display: flex;
      gap: 6px;
      margin: 10px 0 8px;
    }
    .bt-step {
      flex: 1;
      text-align: center;
      padding: 8px 6px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      background: #f1f5f9;
      color: var(--muted);
      border: 1px solid #e2e8f0;
      transition: background var(--motion-fast), color var(--motion-fast);
    }
    .bt-step.done { background: #ecfdf5; color: var(--status-good); border-color: #a7f3d0; }
    .bt-step.active { background: #eff6ff; color: var(--brand); border-color: #93c5fd; box-shadow: 0 0 0 1px #bfdbfe; }
    .journey-rail {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .journey-chip {
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .journey-chip strong { display: block; color: var(--text); font-size: 14px; }
    .trust-pill { margin-top: 6px; }

    body {
      margin: 0;
      background: #f0f2f5;
      color: var(--text);
      font-family: "Noto Sans KR", var(--font-sans);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 48px;
    }

    .site-header {
      background: #fff;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.06);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      transform: translateY(0);
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.32s ease;
    }

    .site-header.is-hidden {
      transform: translateY(-100%);
      box-shadow: none;
    }

    .site-header.is-compact .utility-bar {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .utility-bar {
      background: linear-gradient(90deg, #0f172a 0%, #1e3a8a 100%);
      color: rgba(255, 255, 255, 0.88);
      font-size: 12px;
      max-height: 48px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.28s ease, opacity 0.28s ease;
    }

    .header-spacer {
      height: var(--header-height, 104px);
    }

    .utility-inner {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 0;
      padding-bottom: 0;
    }

    .utility-tagline {
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .main-header-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-top: 0;
      padding-bottom: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-size: 20px;
      color: #0f172a;
      flex-shrink: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border
