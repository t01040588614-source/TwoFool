<!doctype html>
<html lang="ko" data-theme="ops">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCMAGLEV 관제센터 대시보드</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/site-favicon.svg">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    .event-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .event-summary-card {
      padding: 10px;
      border: 1px solid #334155;
      border-radius: var(--radius-sm);
      background: #0f172a;
      cursor: pointer;
      transition: border-color var(--motion-fast);
    }
    .event-summary-card:hover { border-color: var(--accent); }
    .event-summary-card strong { display: block; font-size: 20px; color: #f8fafc; }
    .event-view-toggle { margin-bottom: 8px; }
    .ack-template-row { margin-bottom: 8px; }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 0%, #0c4a6e 0%, var(--bg) 45%);
      color: var(--text);
    }
    header {
      border-bottom: 1px solid #1d4ed8;
      background: linear-gradient(90deg, #082f49 0%, #0f172a 60%, #1e293b 100%);
    }
    .wrap { max-width: var(--dashboard-max, 1480px); margin: 0 auto; padding: 0 22px; }
    @media (min-width: 1800px) {
      .dashboard-body {
        display: grid;
        grid-template-columns: var(--side-width) minmax(0, var(--dashboard-max, 1480px)) var(--side-width);
        grid-template-areas:
          "header header header"
          "left main right";
        column-gap: 20px;
        padding: 0 16px 28px;
        align-items: start;
        justify-content: center;
      }
      .dashboard-header { grid-area: header; }
      .dashboard-main {
        grid-area: main;
        width: 100%;
        max-width: var(--dashboard-max, 1480px);
        margin: 0;
      }
    }
    .bar {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0.4px; }
    h1 span { color: var(--accent); }
    .link-btn {
      color: #bfdbfe;
      background: #1e3a8a;
      text-decoration: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
    }
    .bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .mode-badge.live {
      border-color: #f59e0b;
      background: #fffbeb;
      color: #b45309;
    }
    .mode-badge.ai-ready {
      border-color: #047857;
      background: #059669;
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(4, 120, 87, 0.35);
    }
    .mode-badge.ai-rule {
      border-color: #94a3b8;
      background: #f1f5f9;
      color: #475569;
    }
    .mode-badge.ai-fallback {
      border-color: #fbbf24;
      background: #fffbeb;
      color: #b45309;
    }
    .trust-panel {
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      font-size: 12px;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .trust-panel strong { color: #f8fafc; }
    .trust-risk {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .trust-risk.low { background: #14532d; color: #bbf7d0; }
    .trust-risk.medium { background: #78350f; color: #fde68a; }
    .trust-risk.high { background: #7f1d1d; color: #fecaca; }
    .dashboard-ai-chat {
      margin-top: 4px;
      margin-bottom: 14px;
      border: 1px solid #1e40af;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(180deg, #0c1929 0%, #0f172a 100%);
    }
    .dashboard-ai-chat-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #334155;
      background: linear-gradient(135deg, #
