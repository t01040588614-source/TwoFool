<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 400" fill="none">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="scan5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="400" fill="url(#bg5)"/>
  <!-- control room grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="0" y1="80" x2="1440" y2="80"/><line x1="0" y1="160" x2="1440" y2="160"/>
    <line x1="0" y1="240" x2="1440" y2="240"/><line x1="0" y1="320" x2="1440" y2="320"/>
  </g>
  <rect x="0" y="0" width="1440" height="400" fill="url(#scan5)"/>
  <!-- dashboard panels -->
  <rect x="700" y="60" width="340" height="180" rx="12" fill="#0b1220" stroke="#22d3ee" stroke-opacity="0.3"/>
  <rect x="720" y="80" width="120" height="8" rx="3" fill="#22d3ee" fill-opacity="0.7"/>
  <polyline points="720,200 760,170 800,185 840,140 880,155 920,120 960,130 1000,100" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="210" width="60" height="16" rx="4" fill="#059669" fill-opacity="0.3"/>
  <rect x="790" y="210" width="60" height="16" rx="4" fill="#d97706" fill-opacity="0.3"/>
  <rect x="1060" y="60" width="300" height="130" rx="12" fill="#0b1220" stroke="#334155"/>
  <rect x="1080" y="80" width="90" height="8" rx="3" fill="#64748b"/>
  <rect x="1080" y="100" width="250" height="6" rx="2" fill="#1e293b"/>
  <rect x="1080" y="116" width="220" height="6" rx="2" fill="#1e293b"/>
  <rect x="1080" y="132" width="240" height="6" rx="2" fill="#1e293b"/>
  <rect x="1080" y="148" width="180" height="6" rx="2" fill="#1e293b"/>
  <rect x="1060" y="210" width="300" height="130" rx="12" fill="#0b1220" stroke="#334155"/>
  <!-- signal tower -->
  <rect x="180" y="120" width="8" height="180" fill="#334155"/>
  <circle cx="184" cy="110" r="16" fill="#0891b2" fill-opacity="0.3" stroke="#22d3ee"/>
  <path d="M184 94 L184 70 M170 80 L184 70 L198 80" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <!-- radar -->
  <circle cx="400" cy="220" r="80" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="400" cy="220" r="55" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="400" cy="220" r="30" fill="none" stroke="#1e293b" stroke-width="1"/>
  <line x1="400" y1="220" x2="460" y2="170" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="430" cy="195" r="5" fill="#22d3ee"/>
  <circle cx="385" cy="250" r="4" fill="#fbbf24"/>
  <!-- live train blips on track -->
  <rect x="120" y="300" width="500" height="3" rx="1.5" fill="#334155"/>
  <circle cx="220" cy="301" r="6" fill="#22d3ee"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="301" r="6" fill="#34d399"><animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="301" r="6" fill="#fbbf24"><animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
