[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "extensions",
    "ml_predictor",
    "models",
    "network_seed",
    "openai_recommender",
]
combine-as-imports = true
force-sort-within-sections = true
