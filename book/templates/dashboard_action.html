<!doctype html>
<html lang="ko" data-theme="ops">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관제 액션 실행</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <style>
    :root {
      --accent-dark: var(--accent-deep);
    }
    body {
      margin: 0;
      background: radial-gradient(circle at 20% 0%, #0c4a6e 0%, var(--bg) 45%);
      color: var(--text);
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 18px 40px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      padding: 22px;
      box-shadow: 0 10px 28px #02061788;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; color: #f8fafc; }
    .meta { color: var(--muted); font-size: 15px; line-height: 1.5; }
    .field { margin-top: 14px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #bae6fd;
      font-size: 14px;
      font-weight: 700;
    }
    input, textarea, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #111b2f;
      color: #e2e8f0;
      font: inherit;
      padding: 12px 14px;
    }
    textarea { min-height: 160px; resize: vertical; font-size: 15px; line-height: 1.55; }
    .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .row button, .row a { width: auto; min-width: 160px; cursor: pointer; border: 0; }
    .primary { background: var(--accent); color: #fff; font-weight: 700; }
    .primary:hover { background: var(--accent-dark); }
    .secondary {
      background: #334155;
      color: #e2e8f0;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .status {
      margin-top: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      background: #0f172a;
      font-size: 15px;
      line-height: 1.5;
    }
    .status.ok {
      border-color: #14532d;
      color: #bbf7d0;
      background: #052e1a;
    }
    .status.error {
      border-color: #7f1d1d;
      color: #fecaca;
      background: #3f1d1d;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <main class="wrap">
    {% if not_found %}
      <section class="card">
        <h1>요청한 액션 페이지를 찾을 수 없습니다.</h1>
        <p class="meta">URL을 확인해 주세요.</p>
        <div class="row">
          <a class="secondary" href="/dashboard">관제 대시보드로 돌아가기</a>
        </div>
      </section>
    {% else %}
      <section class="card">
        <h1>{{ page.title }}</h1>
        <p class="meta">{{ page.description }}</p>

        <div class="field">
          <label for="action-type">액션 타입</label>
          <input id="action-type" value="{{ page.action_type }}" readonly>
        </div>
        <div class="field">
          <label for="target-event-id">대상 이벤트 ID (선택)</label>
          <input id="target-event-id" inputmode="numeric" placeholder="예: 120">
        </div>
        <div class="field">
          <label for="action-note">조치 메모 / 안내문</label>
          <textarea id="action-note">{{ page.default_note }}</textarea>
        </div>
        <div class="row">
          <button id="execute-action" class="primary" type="button">실행 및 기록</button>
          <a class="secondary" href="/dashboard">대시보드로 돌아가기</a>
        </div>
        <div id="result" class="status">관제사/관리자 로그인 상태에서 실행하면 운영 로그에 기록됩니다.</div>
        <p class="hint">실행 후 이벤트 로그의 <strong>운영액션</strong> 탭에서 기록을 확인할 수 있습니다.</p>
      </section>
    {% endif %}
  </main>

  {% if not_found == false %}
  <script id="action-page-data" type="application/json">
    {{ {"actionType": page.action_type, "actionKey": action_key, "defaultNote": page.default_note}|tojson }}
  </script>
  <script>
    const pageData = JSON.parse(document.getElementById("action-page-data").textContent);
    const actionType = pageData.actionType;
    const actionKey = pageData.actionKey;
    const defaultNote = pageData.defaultNote;
    const params = new URLSearchParams(window.location.search);
    const eventIdParam = params.get("event_id");
    const noteParam = params.get("note");

    const eventInput = document.getElementById("target-event-id");
    const noteInput = document.getElementById("action-note");
    const resultNode = document.getElementById("result");
    const executeBtn = document.getElementById("execute-action");

    if (eventIdParam) eventInput.value = eventIdParam;
    if (noteParam) noteInput.value = noteParam;
    if (!noteInput.value.trim()) noteInput.value = defaultNote;

    async function copyNoteText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_) {
        noteInput.focus();
        noteInput.select();
        return document.execCommand("copy");
      }
    }

    async function runAction() {
      executeBtn.disabled = true;
      resultNode.textContent = "실행 중...";
      resultNode.classList.remove("error", "ok");

      const token = localStorage.getItem("controller_token") || localStorage.getItem("token");
      if (!token) {
        resultNode.textContent = "로그인 토큰이 없습니다. 대시보드에서 관제 로그인 후 다시 시도하세요.";
        resultNode.classList.add("error");
        executeBtn.disabled = false;
        return;
      }

      const eventIdRaw = eventInput.value.trim();
      const body = {
        action_type: actionType,
        note: noteInput.value.trim(),
      };
      if (eventIdRaw) body.event_id = Number(eventIdRaw);

      try {
        const response = await fetch("/api/scmaglev/dashboard/actions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify(body),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "실행 실패");

        if (actionKey === "handover-copy") {
          const copied = await copyNoteText(noteInput.value.trim());
          resultNode.textContent = copied
            ? `완료: 메모 복사 + 기록 (#${data.action.id})`
            : `기록 완료 (#${data.action.id}), 메모 복사는 수동으로 진행해주세요.`;
        } else {
          resultNode.textContent = `완료: ${data.action.event_type} (#${data.action.id})`;
        }
        resultNode.classList.add("ok");

        if (actionKey === "incident-focus" && body.event_id) {
          setTimeout(() => {
            window.location.href = `/dashboard?focus_event=${body.event_id}`;
          }, 900);
        }
      } catch (error) {
        resultNode.textContent = `실패: ${error.message}`;
        resultNode.classList.add("error");
      } finally {
        executeBtn.disabled = false;
      }
    }

    executeBtn.onclick = runAction;
  </script>
  {% endif %}
</body>
</html>
